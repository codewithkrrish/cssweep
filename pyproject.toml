[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cssweep"
version = "0.1.0"
description = "Find CSS selectors nothing in your project uses, and clean them out"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Krrish", email = "codewithkrrish7@gmail.com" }]
keywords = ["css", "unused-css", "dead-code", "cli", "webdev"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
cssweep = "cssweep.cli:main"

[project.urls]
Homepage = "https://github.com/codewithkrrish/cssweep"

[tool.setuptools.packages.find]
include = ["cssweep*"]
